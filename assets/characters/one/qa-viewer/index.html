<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE · QA visual</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#10131a;color:#f4f7fb}main{max-width:1100px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{background:#24314a;padding:6px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#171c26;border:1px solid #30394b;border-radius:18px;padding:14px}.card img{width:100%;height:340px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/20px 20px;border-radius:12px}.wide{grid-column:1/-1}.wide img{height:auto;max-height:700px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}#approve{background:#55d6a7}#reject{background:#ff8f8f}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#0d1118;color:white;border:1px solid #39445a;border-radius:10px;padding:10px}.actions{display:flex;gap:10px;margin-top:10px}.status{margin-top:10px;color:#aab6cc}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card img{height:280px}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><main><div class="hero"><div><h1>ONE · QA visual</h1><p>Revisión fidelity-first. Nada se promueve sólo por validez técnica.</p></div><span class="badge">head-neutral · revisión</span></div><div class="grid">
<section class="card"><h2>Master neutral</h2><img src="../source/raster/components/head/head-neutral.png" alt="Head neutral"></section>
<section class="card"><h2>Master de partes</h2><img src="../references/one-character-parts-clean.png" alt="Parts clean"></section>
<section class="card wide"><h2>Candidatos existentes</h2><img src="../work/head-neutral-review/head-neutral-candidates.jpg" alt="Candidates"></section>
<section class="card wide"><h2>Tu validación</h2><textarea id="note" placeholder="Qué está bien o qué hay que corregir..."></textarea><div class="actions"><button id="approve">Aprobar</button><button id="reject">Rechazar</button></div><div class="status" id="status">Pendiente de revisión visual.</div></section>
</div></main><script>
async function review(status){const note=document.querySelector('#note').value;const r=await fetch('./api/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({asset:'head-neutral',status,note})});const j=await r.json();document.querySelector('#status').textContent=j.ok?'Guardado: '+status+'.':'Error al guardar.'}document.querySelector('#approve').onclick=()=>review('approved');document.querySelector('#reject').onclick=()=>review('rejected');
</script></body></html>
