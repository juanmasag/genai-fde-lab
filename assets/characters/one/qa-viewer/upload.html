<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE · cargar 6 fuentes</title><style>body{font:16px system-ui;background:#101621;color:#fff;max-width:720px;margin:auto;padding:24px}label{display:block;margin:18px 0}button{font-size:18px;padding:12px 18px}input{display:block;margin-top:6px}pre{white-space:pre-wrap}</style><h1>Cargar 6 fuentes ONE</h1><p>Seleccioná cada imagen según la vista. Al enviar se guarda el original en el repo y se genera automáticamente el PNG transparente sin rediseñar el personaje.</p><form id=f><label>Cabeza frontal<input name=front-head type=file accept=image/png required></label><label>Frontal con tablet<input name=front-tablet type=file accept=image/png required></label><label>3/4 con tablet<input name=quarter-tablet type=file accept=image/png required></label><label>Lateral con tablet<input name=side-tablet type=file accept=image/png required></label><label>Espalda<input name=back type=file accept=image/png required></label><label>Pose gestual<input name=gesture-tablet type=file accept=image/png required></label><button>Guardar y procesar</button></form><pre id=o></pre><script>f.onsubmit=async e=>{e.preventDefault();o.textContent='Procesando…';let r=await fetch('./api/upload-sources',{method:'POST',body:new FormData(f)});o.textContent=await r.text()}</script>
