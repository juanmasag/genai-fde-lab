services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: raglab
    ports:
      - "5433:5432"
    volumes:
      - rag_engine_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rag_engine_pg:
